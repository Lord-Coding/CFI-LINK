<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Icônes & PWA -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/favicon.png" sizes="192x192" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport Ionic (conservé tel quel — requis pour Ionic) -->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Thème & comportement mobile -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0054e9" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CFI-LINK" />

    <!-- SEO -->
    <title>CFI-LINK — Plateforme académique du CFI-CIRAS</title>
    <meta
      name="description"
      content="CFI-LINK est la plateforme e-learning du CFI-CIRAS. Gérez vos cours, suivez vos notes et connectez-vous à votre communauté universitaire."
    />
    <meta name="author" content="CFI-CIRAS" />

    <!-- Open Graph -->
    <meta property="og:title" content="CFI-LINK — Plateforme académique du CFI-CIRAS" />
    <meta
      property="og:description"
      content="Cours en ligne, notes, présences, documents et communauté — tout ce dont vous avez besoin pour réussir votre licence."
    />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CFI-LINK" />
    <meta name="twitter:description" content="La plateforme académique du CFI-CIRAS." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
